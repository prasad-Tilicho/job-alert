[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobalert"
version = "0.1.0"
description = "Automated job-notification posters published to Instagram from GitHub Actions"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
jobalert = "jobalert.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/jobalert"]
omit = ["*/__main__.py"]
