name: Delete Instagram posts

# Manual only, and deliberately so: deleting a post cannot be undone.
on:
  workflow_dispatch:
    inputs:
      media_ids:
        description: "Media ids to delete (comma or space separated)"
        required: true
        type: string
      confirm:
        description: "Type DELETE to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Delete
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_IDS: ${{ inputs.media_ids }}
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/delete_media.py
