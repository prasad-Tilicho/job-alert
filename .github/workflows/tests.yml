name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "out/**"
      - "state/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=src/jobalert --cov-report=term-missing --cov-fail-under=80
