name: Publish job posters

on:
  schedule:
    # 04:00 and 12:00 UTC = 09:30 and 17:30 IST. GitHub runs scheduled jobs late
    # under load, so never rely on the exact minute.
    - cron: "0 4,12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render posters and print captions without publishing"
        type: boolean
        default: false

permissions:
  contents: write

# Two runs pushing posters at once would race on the same branch.
concurrency:
  group: publish-job-posters
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A push made with GITHUB_TOKEN does not always count as "repository
          # activity", and GitHub disables cron schedules after 60 quiet days.
          # Pushing as the PAT owner keeps the schedule alive.
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN }}
          PAUSED: ${{ vars.PAUSED }}
          ENABLE_GEO_RESTRICTED: ${{ vars.ENABLE_GEO_RESTRICTED }}
        run: |
          python -m jobalert.publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload posters for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: posters-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
